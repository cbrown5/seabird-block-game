<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ocean Survey Data Collection Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #1a5f7a 0%, #159895 50%, #57c5b6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
        }

        .game-container {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            max-height: 700px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .game-header {
            background: linear-gradient(135deg, #1a5f7a 0%, #159895 100%);
            color: white;
            padding: 15px 20px;
            border-bottom: 3px solid #0d3d4d;
        }

        .game-header h1 {
            font-size: 1.6rem;
            margin-bottom: 10px;
            text-align: center;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            font-size: 0.9rem;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 600;
        }

        #game-canvas {
            flex: 1;
            background: linear-gradient(180deg, #2a9d8f 0%, #1a7a6e 100%);
            display: block;
            cursor: pointer;
        }

        .instructions {
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px 15px;
            text-align: center;
            font-size: 0.8rem;
            line-height: 1.5;
        }

        .instructions p {
            margin: 3px 0;
        }

        .game-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .overlay-content {
            background: linear-gradient(135deg, #1a5f7a 0%, #159895 100%);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
            color: white;
        }

        .overlay-content h2 {
            margin-bottom: 20px;
            font-size: 2.5rem;
        }

        .overlay-content p {
            margin-bottom: 20px;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .habitat-list {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
        }

        .habitat-list div {
            padding: 5px 0;
            font-size: 1rem;
        }

        #restart-button {
            background: linear-gradient(135deg, #00ff88 0%, #00cc66 100%);
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }

        #restart-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.5);
        }

        #restart-button:active {
            transform: scale(0.95);
        }

        @media (max-width: 768px) {
            .game-container {
                max-width: 100%;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }

            .game-header h1 {
                font-size: 1.3rem;
            }

            .stats-bar {
                gap: 8px;
                font-size: 0.8rem;
            }

            .instructions {
                font-size: 0.7rem;
                padding: 8px 12px;
            }

            .overlay-content {
                padding: 30px 20px;
            }

            .overlay-content h2 {
                font-size: 2rem;
            }

            .overlay-content p {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>🚣 Ocean Survey Data Collection</h1>
            <div class="stats-bar">
                <div class="stat">
                    <span>🌳 Forest:</span>
                    <span id="forest-count">0/5</span>
                </div>
                <div class="stat">
                    <span>🏔️ Mountain:</span>
                    <span id="mountain-count">0/5</span>
                </div>
                <div class="stat">
                    <span>🏖️ Beach:</span>
                    <span id="beach-count">0/5</span>
                </div>
                <div class="stat">
                    <span>🌾 Grassland:</span>
                    <span id="grassland-count">0/5</span>
                </div>
                <div class="stat">
                    <span>Level:</span>
                    <span id="level">1</span>
                </div>
            </div>
        </div>

        <canvas id="game-canvas"></canvas>

        <div class="instructions">
            <p>🎮 Arrow keys/WASD/Click to move | Collect 5 samples of each habitat | 🐊 Avoid crocodiles (steal data) | 🌿 Avoid seaweed (entangles boat)</p>
        </div>
    </div>

    <div class="game-overlay" id="game-overlay" style="display: none;">
        <div class="overlay-content">
            <h2 id="overlay-title">Game Over</h2>
            <p id="overlay-message"></p>
            <div id="habitat-summary" class="habitat-list"></div>
            <button id="restart-button">Play Again</button>
        </div>
    </div>

    <script>
        // Game configuration
        const CONFIG = {
            BOAT_SPEED: 3,
            BOAT_SLOW_SPEED: 1.5,
            BOAT_SIZE: 30,
            HABITAT_SIZE: 40,
            HABITAT_COUNT: 12,
            CROCODILE_COUNT: 3,
            CROCODILE_SPEED: 1.5,
            CROCODILE_SIZE: 35,
            SEAWEED_COUNT: 8,
            SEAWEED_SIZE: 30,
            SAMPLES_PER_HABITAT: 5,
            ENTANGLE_DURATION: 2000, // ms
            DATA_STEAL_AMOUNT: 2,
        };

        const HABITAT_TYPES = [
            { emoji: '🌳', name: 'Forest', color: '#228B22' },
            { emoji: '🏔️', name: 'Mountain', color: '#8B7355' },
            { emoji: '🏖️', name: 'Beach', color: '#F4A460' },
            { emoji: '🌾', name: 'Grassland', color: '#9ACD32' }
        ];

        class Game {
            constructor() {
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.resizeCanvas();

                // Game state
                this.running = false;
                this.level = 1;
                this.boat = null;
                this.habitats = [];
                this.crocodiles = [];
                this.seaweed = [];
                this.samples = {
                    'Forest': 0,
                    'Mountain': 0,
                    'Beach': 0,
                    'Grassland': 0
                };
                this.entangled = false;
                this.entangleEndTime = 0;

                // Feedback message
                this.feedbackMessage = null;
                this.feedbackEndTime = 0;

                // Input
                this.keys = {};
                this.mousePos = null;
                this.touchPos = null;

                // Animation
                this.lastTime = 0;
                this.animationId = null;

                this.init();
            }

            resizeCanvas() {
                const rect = this.canvas.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
            }

            init() {
                this.setupInputHandlers();
                
                // Handle window resize
                window.addEventListener('resize', () => {
                    this.resizeCanvas();
                });
                
                this.startGame();
            }

            checkCollision(obj1, obj2, threshold) {
                const dx = obj1.x - obj2.x;
                const dy = obj1.y - obj2.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                return dist < threshold;
            }

            setupInputHandlers() {
                // Keyboard
                window.addEventListener('keydown', (e) => {
                    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(e.key)) {
                        e.preventDefault();
                    }
                    this.keys[e.key.toLowerCase()] = true;
                });

                window.addEventListener('keyup', (e) => {
                    this.keys[e.key.toLowerCase()] = false;
                });

                // Mouse
                this.canvas.addEventListener('mousedown', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    this.mousePos = {
                        x: e.clientX - rect.left,
                        y: e.clientY - rect.top
                    };
                });

                this.canvas.addEventListener('mouseup', () => {
                    this.mousePos = null;
                });

                // Touch
                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const rect = this.canvas.getBoundingClientRect();
                    const touch = e.touches[0];
                    this.touchPos = {
                        x: touch.clientX - rect.left,
                        y: touch.clientY - rect.top
                    };
                });

                this.canvas.addEventListener('touchend', () => {
                    this.touchPos = null;
                });

                this.canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const rect = this.canvas.getBoundingClientRect();
                    const touch = e.touches[0];
                    this.touchPos = {
                        x: touch.clientX - rect.left,
                        y: touch.clientY - rect.top
                    };
                });

                // Restart button
                document.getElementById('restart-button').addEventListener('click', () => {
                    this.restart();
                });
            }

            startGame() {
                this.running = true;
                this.level = 1;
                this.samples = {
                    'Forest': 0,
                    'Mountain': 0,
                    'Beach': 0,
                    'Grassland': 0
                };
                this.entangled = false;

                // Create boat at center
                this.boat = {
                    x: this.canvas.width / 2,
                    y: this.canvas.height / 2,
                    vx: 0,
                    vy: 0,
                    angle: 0
                };

                // Create habitats
                this.habitats = [];
                for (let i = 0; i < CONFIG.HABITAT_COUNT; i++) {
                    const type = HABITAT_TYPES[i % HABITAT_TYPES.length];
                    this.habitats.push({
                        x: Math.random() * (this.canvas.width - 100) + 50,
                        y: Math.random() * (this.canvas.height - 100) + 50,
                        type: type,
                        collected: false
                    });
                }

                // Create crocodiles
                this.crocodiles = [];
                for (let i = 0; i < CONFIG.CROCODILE_COUNT + Math.floor(this.level / 2); i++) {
                    this.crocodiles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * CONFIG.CROCODILE_SPEED,
                        vy: (Math.random() - 0.5) * CONFIG.CROCODILE_SPEED,
                        angle: Math.random() * Math.PI * 2
                    });
                }

                // Create seaweed
                this.seaweed = [];
                for (let i = 0; i < CONFIG.SEAWEED_COUNT + this.level; i++) {
                    this.seaweed.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height
                    });
                }

                this.updateUI();
                this.gameLoop(0);
            }

            restart() {
                document.getElementById('game-overlay').style.display = 'none';
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
                this.startGame();
            }

            updateUI() {
                document.getElementById('forest-count').textContent = `${this.samples['Forest']}/5`;
                document.getElementById('mountain-count').textContent = `${this.samples['Mountain']}/5`;
                document.getElementById('beach-count').textContent = `${this.samples['Beach']}/5`;
                document.getElementById('grassland-count').textContent = `${this.samples['Grassland']}/5`;
                document.getElementById('level').textContent = this.level;
            }

            gameLoop(timestamp) {
                if (!this.running) return;

                const deltaTime = timestamp - this.lastTime;
                this.lastTime = timestamp;

                this.update(deltaTime);
                this.render();

                this.animationId = requestAnimationFrame((t) => this.gameLoop(t));
            }

            update(deltaTime) {
                const dt = Math.min(deltaTime / 16.67, 2); // Cap at 2x normal speed

                // Check if entanglement has expired
                if (this.entangled && Date.now() > this.entangleEndTime) {
                    this.entangled = false;
                }

                // Check if feedback message has expired
                if (this.feedbackMessage && Date.now() > this.feedbackEndTime) {
                    this.feedbackMessage = null;
                }

                // Update boat based on input
                const speed = this.entangled ? CONFIG.BOAT_SLOW_SPEED : CONFIG.BOAT_SPEED;
                this.boat.vx = 0;
                this.boat.vy = 0;

                // Keyboard input
                if (this.keys['arrowup'] || this.keys['w']) this.boat.vy = -speed;
                if (this.keys['arrowdown'] || this.keys['s']) this.boat.vy = speed;
                if (this.keys['arrowleft'] || this.keys['a']) this.boat.vx = -speed;
                if (this.keys['arrowright'] || this.keys['d']) this.boat.vx = speed;

                // Mouse/touch input
                const targetPos = this.touchPos || this.mousePos;
                if (targetPos) {
                    const dx = targetPos.x - this.boat.x;
                    const dy = targetPos.y - this.boat.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 10) {
                        this.boat.vx = (dx / dist) * speed;
                        this.boat.vy = (dy / dist) * speed;
                    }
                }

                // Update boat position
                this.boat.x += this.boat.vx * dt;
                this.boat.y += this.boat.vy * dt;

                // Update boat angle
                if (this.boat.vx !== 0 || this.boat.vy !== 0) {
                    this.boat.angle = Math.atan2(this.boat.vy, this.boat.vx);
                }

                // Keep boat in bounds
                this.boat.x = Math.max(20, Math.min(this.canvas.width - 20, this.boat.x));
                this.boat.y = Math.max(20, Math.min(this.canvas.height - 20, this.boat.y));

                // Update crocodiles
                for (const croc of this.crocodiles) {
                    croc.x += croc.vx * dt;
                    croc.y += croc.vy * dt;

                    // Bounce off walls
                    if (croc.x < 20 || croc.x > this.canvas.width - 20) croc.vx *= -1;
                    if (croc.y < 20 || croc.y > this.canvas.height - 20) croc.vy *= -1;

                    // Keep in bounds
                    croc.x = Math.max(20, Math.min(this.canvas.width - 20, croc.x));
                    croc.y = Math.max(20, Math.min(this.canvas.height - 20, croc.y));

                    // Update angle
                    croc.angle = Math.atan2(croc.vy, croc.vx);
                }

                // Check collisions with habitats
                for (const habitat of this.habitats) {
                    if (habitat.collected) continue;

                    if (this.checkCollision(this.boat, habitat, CONFIG.BOAT_SIZE)) {
                        if (this.samples[habitat.type.name] < CONFIG.SAMPLES_PER_HABITAT) {
                            this.samples[habitat.type.name]++;
                            habitat.collected = true;
                            this.updateUI();
                            this.checkLevelComplete();
                        }
                    }
                }

                // Check collisions with seaweed
                for (const weed of this.seaweed) {
                    if (this.checkCollision(this.boat, weed, CONFIG.SEAWEED_SIZE)) {
                        if (!this.entangled) {
                            this.entangled = true;
                            this.entangleEndTime = Date.now() + CONFIG.ENTANGLE_DURATION;
                        }
                    }
                }

                // Check collisions with crocodiles
                for (const croc of this.crocodiles) {
                    if (this.checkCollision(this.boat, croc, CONFIG.CROCODILE_SIZE)) {
                        // Crocodile steals data
                        this.stealData();
                        // Move crocodile away and keep in bounds
                        croc.x += (Math.random() - 0.5) * 100;
                        croc.y += (Math.random() - 0.5) * 100;
                        croc.x = Math.max(20, Math.min(this.canvas.width - 20, croc.x));
                        croc.y = Math.max(20, Math.min(this.canvas.height - 20, croc.y));
                    }
                }
            }

            stealData() {
                // Find habitat types with collected samples
                const types = Object.keys(this.samples).filter(t => this.samples[t] > 0);
                if (types.length === 0) return;

                // Steal from a random type
                const type = types[Math.floor(Math.random() * types.length)];
                const stolen = Math.min(CONFIG.DATA_STEAL_AMOUNT, this.samples[type]);
                this.samples[type] -= stolen;
                this.updateUI();

                // Flash the screen or show feedback
                this.showFeedback(`🐊 Crocodile stole ${stolen} ${type} sample${stolen > 1 ? 's' : ''}!`);
            }

            showFeedback(message) {
                // Show visual feedback message
                this.feedbackMessage = message;
                this.feedbackEndTime = Date.now() + 2000; // Show for 2 seconds
            }

            checkLevelComplete() {
                const allComplete = Object.values(this.samples).every(count => count >= CONFIG.SAMPLES_PER_HABITAT);
                if (allComplete) {
                    this.levelComplete();
                }
            }

            levelComplete() {
                this.running = false;
                this.level++;
                
                const overlay = document.getElementById('game-overlay');
                const title = document.getElementById('overlay-title');
                const message = document.getElementById('overlay-message');
                const summary = document.getElementById('habitat-summary');

                title.textContent = '🎉 Level Complete!';
                message.textContent = `Congratulations! You collected a balanced survey with 5 samples of each habitat type. Moving to Level ${this.level}!`;
                
                summary.innerHTML = `
                    <div>🌳 Forest: ${this.samples['Forest']}/5</div>
                    <div>🏔️ Mountain: ${this.samples['Mountain']}/5</div>
                    <div>🏖️ Beach: ${this.samples['Beach']}/5</div>
                    <div>🌾 Grassland: ${this.samples['Grassland']}/5</div>
                `;

                overlay.style.display = 'flex';

                // Auto-restart after a delay
                setTimeout(() => {
                    overlay.style.display = 'none';
                    this.startGame();
                }, 3000);
            }

            render() {
                // Clear canvas
                this.ctx.fillStyle = '#1a7a6e';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw water pattern
                this.ctx.fillStyle = 'rgba(42, 157, 143, 0.3)';
                for (let i = 0; i < 20; i++) {
                    const x = (this.lastTime / 50 + i * 50) % this.canvas.width;
                    this.ctx.fillRect(x, 0, 2, this.canvas.height);
                }

                // Draw seaweed
                for (const weed of this.seaweed) {
                    this.ctx.font = '25px Arial';
                    this.ctx.fillText('🌿', weed.x - 12, weed.y + 12);
                }

                // Draw habitats
                for (const habitat of this.habitats) {
                    if (habitat.collected) continue;
                    
                    this.ctx.font = '35px Arial';
                    this.ctx.fillText(habitat.type.emoji, habitat.x - 17, habitat.y + 17);
                }

                // Draw crocodiles
                for (const croc of this.crocodiles) {
                    this.ctx.save();
                    this.ctx.translate(croc.x, croc.y);
                    this.ctx.rotate(croc.angle);
                    this.ctx.font = '30px Arial';
                    this.ctx.fillText('🐊', -15, 10);
                    this.ctx.restore();
                }

                // Draw boat
                this.ctx.save();
                this.ctx.translate(this.boat.x, this.boat.y);
                this.ctx.rotate(this.boat.angle);
                this.ctx.font = '25px Arial';
                
                // Flash when entangled
                if (this.entangled && Math.floor(Date.now() / 200) % 2 === 0) {
                    this.ctx.globalAlpha = 0.5;
                }
                
                this.ctx.fillText('🚣', -12, 8);
                this.ctx.restore();

                // Draw entanglement indicator
                if (this.entangled) {
                    this.ctx.save();
                    this.ctx.translate(this.boat.x, this.boat.y);
                    this.ctx.font = '20px Arial';
                    this.ctx.fillText('🌿', -10, -20);
                    this.ctx.restore();
                }

                // Draw feedback message
                if (this.feedbackMessage) {
                    this.ctx.save();
                    this.ctx.font = 'bold 20px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    this.ctx.fillRect(0, this.canvas.height - 60, this.canvas.width, 50);
                    this.ctx.fillStyle = '#ffcc00';
                    this.ctx.fillText(this.feedbackMessage, this.canvas.width / 2, this.canvas.height - 30);
                    this.ctx.restore();
                }
            }
        }

        // Start the game when page loads
        window.addEventListener('load', () => {
            new Game();
        });
    </script>
</body>
</html>
