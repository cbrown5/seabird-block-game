<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>River Data Collection Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(to bottom, #87CEEB 0%, #4682B4 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .game-header {
            background: linear-gradient(135deg, #2C5F7C 0%, #1E4D6B 100%);
            color: white;
            padding: 1rem;
            text-align: center;
        }

        .game-header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.9rem;
        }

        .stat-value {
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 0.2rem;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 500px;
            background: linear-gradient(to bottom, #6BA3C5 0%, #4A8FB0 100%);
            border-top: 3px solid #2C5F7C;
            border-bottom: 3px solid #2C5F7C;
        }

        .controls-info {
            padding: 1rem;
            background: #f0f0f0;
            text-align: center;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .controls-info strong {
            color: #2C5F7C;
        }

        .data-collection {
            padding: 1rem;
            background: white;
            border-top: 2px solid #ddd;
        }

        .data-collection h3 {
            color: #2C5F7C;
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .data-types {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .data-type {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.3rem 0.6rem;
            background: #f5f5f5;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .data-icon {
            font-size: 1.2rem;
        }

        .game-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .overlay-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .overlay-content h2 {
            color: #2C5F7C;
            margin-bottom: 1rem;
        }

        .overlay-content p {
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        button {
            background: #2C5F7C;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #1E4D6B;
        }

        button:active {
            transform: scale(0.98);
        }

        .status-message {
            padding: 0.5rem 1rem;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            margin: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            #game-canvas {
                height: 400px;
            }

            .game-header h1 {
                font-size: 1.4rem;
            }

            .controls-info {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>🚣 River Data Collection</h1>
            <div class="stats-bar">
                <div class="stat">
                    <span>Level</span>
                    <span class="stat-value" id="level">1</span>
                </div>
                <div class="stat">
                    <span>Score</span>
                    <span class="stat-value" id="score">0</span>
                </div>
                <div class="stat">
                    <span>Speed</span>
                    <span class="stat-value" id="speed">100%</span>
                </div>
            </div>
        </div>

        <canvas id="game-canvas"></canvas>

        <div class="controls-info">
            <strong>Controls:</strong> Use Arrow Keys or WASD to move • Touch/Click to move on mobile
        </div>

        <div class="data-collection">
            <h3>Collected Data Samples:</h3>
            <div class="data-types">
                <div class="data-type">
                    <span class="data-icon">🌳</span>
                    <span>Forest: <strong id="forest-count">0/3</strong></span>
                </div>
                <div class="data-type">
                    <span class="data-icon">🏔️</span>
                    <span>Mountain: <strong id="mountain-count">0/3</strong></span>
                </div>
                <div class="data-type">
                    <span class="data-icon">🏖️</span>
                    <span>Beach: <strong id="beach-count">0/3</strong></span>
                </div>
                <div class="data-type">
                    <span class="data-icon">🌾</span>
                    <span>Grassland: <strong id="grassland-count">0/3</strong></span>
                </div>
            </div>
        </div>

        <div id="status-message" class="status-message" style="display: none;"></div>
    </div>

    <div class="game-overlay" id="game-overlay" style="display: none;">
        <div class="overlay-content">
            <h2 id="overlay-title">Level Complete!</h2>
            <p id="overlay-message">Great work collecting balanced data!</p>
            <button id="continue-button">Continue</button>
        </div>
    </div>

    <script>
        // Game configuration
        const config = {
            canvasWidth: 800,
            canvasHeight: 500,
            playerSize: 30,
            dataSize: 25,
            obstacleSize: 35,
            seaweedSize: 20,
            baseSpeed: 3,
            dataFloatSpeed: 1,
            crocodileSpeed: 0.5,
            requiredPerType: 3,
            seaweedSlowFactor: 0.4,
            seaweedDuration: 2000
        };

        // Game state
        const game = {
            canvas: null,
            ctx: null,
            player: null,
            dataItems: [],
            crocodiles: [],
            seaweeds: [],
            keys: {},
            level: 1,
            score: 0,
            collectedData: {
                forest: 0,
                mountain: 0,
                beach: 0,
                grassland: 0
            },
            speedMultiplier: 1,
            seaweedTimer: null,
            gameRunning: true,
            touchStartX: null,
            touchStartY: null
        };

        // Data types with their icons and colors
        const dataTypes = [
            { type: 'forest', icon: '🌳', color: '#228B22' },
            { type: 'mountain', icon: '🏔️', color: '#696969' },
            { type: 'beach', icon: '🏖️', color: '#F4A460' },
            { type: 'grassland', icon: '🌾', color: '#9ACD32' }
        ];

        // Initialize game
        function init() {
            game.canvas = document.getElementById('game-canvas');
            game.ctx = game.canvas.getContext('2d');
            
            // Set canvas size
            const rect = game.canvas.getBoundingClientRect();
            game.canvas.width = config.canvasWidth;
            game.canvas.height = config.canvasHeight;

            // Initialize player (boat)
            game.player = {
                x: config.canvasWidth / 2,
                y: config.canvasHeight - 60,
                width: config.playerSize,
                height: config.playerSize,
                speed: config.baseSpeed
            };

            // Spawn initial data items
            spawnDataItems();

            // Spawn crocodiles
            spawnCrocodiles();

            // Spawn seaweed
            spawnSeaweed();

            // Event listeners
            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('keyup', handleKeyUp);
            game.canvas.addEventListener('click', handleCanvasClick);
            game.canvas.addEventListener('touchstart', handleTouchStart);
            game.canvas.addEventListener('touchmove', handleTouchMove);
            game.canvas.addEventListener('touchend', handleTouchEnd);
            document.getElementById('continue-button').addEventListener('click', nextLevel);

            // Start game loop
            gameLoop();
        }

        function spawnDataItems() {
            const itemsPerType = 3 + game.level;
            dataTypes.forEach(dataType => {
                for (let i = 0; i < itemsPerType; i++) {
                    game.dataItems.push({
                        x: Math.random() * (config.canvasWidth - config.dataSize),
                        y: Math.random() * (config.canvasHeight * 0.7), // Upper 70% of canvas
                        width: config.dataSize,
                        height: config.dataSize,
                        type: dataType.type,
                        icon: dataType.icon,
                        color: dataType.color,
                        velocityY: config.dataFloatSpeed * (0.5 + Math.random())
                    });
                }
            });
        }

        function spawnCrocodiles() {
            const count = 2 + Math.floor(game.level / 2);
            for (let i = 0; i < count; i++) {
                game.crocodiles.push({
                    x: Math.random() * (config.canvasWidth - config.obstacleSize),
                    y: Math.random() * (config.canvasHeight * 0.6),
                    width: config.obstacleSize,
                    height: config.obstacleSize,
                    velocityX: (Math.random() - 0.5) * config.crocodileSpeed * 2,
                    velocityY: config.crocodileSpeed * (0.5 + Math.random())
                });
            }
        }

        function spawnSeaweed() {
            // Spawn seaweed near crocodiles
            game.crocodiles.forEach(croc => {
                const seaweedCount = 2 + Math.floor(Math.random() * 3);
                for (let i = 0; i < seaweedCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 40 + Math.random() * 60;
                    game.seaweeds.push({
                        x: croc.x + Math.cos(angle) * distance,
                        y: croc.y + Math.sin(angle) * distance,
                        width: config.seaweedSize,
                        height: config.seaweedSize,
                        velocityY: config.dataFloatSpeed * 0.3
                    });
                }
            });

            // Add some random seaweed
            const randomCount = 3 + game.level;
            for (let i = 0; i < randomCount; i++) {
                game.seaweeds.push({
                    x: Math.random() * (config.canvasWidth - config.seaweedSize),
                    y: Math.random() * (config.canvasHeight * 0.7),
                    width: config.seaweedSize,
                    height: config.seaweedSize,
                    velocityY: config.dataFloatSpeed * 0.3
                });
            }
        }

        function handleKeyDown(e) {
            game.keys[e.key.toLowerCase()] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
            }
        }

        function handleKeyUp(e) {
            game.keys[e.key.toLowerCase()] = false;
        }

        function handleCanvasClick(e) {
            const rect = game.canvas.getBoundingClientRect();
            const scaleX = game.canvas.width / rect.width;
            const scaleY = game.canvas.height / rect.height;
            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;
            
            movePlayerTowards(clickX, clickY);
        }

        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = game.canvas.getBoundingClientRect();
            game.touchStartX = touch.clientX - rect.left;
            game.touchStartY = touch.clientY - rect.top;
        }

        function handleTouchMove(e) {
            e.preventDefault();
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            if (game.touchStartX !== null && game.touchStartY !== null) {
                const rect = game.canvas.getBoundingClientRect();
                const scaleX = game.canvas.width / rect.width;
                const scaleY = game.canvas.height / rect.height;
                const clickX = game.touchStartX * scaleX;
                const clickY = game.touchStartY * scaleY;
                
                movePlayerTowards(clickX, clickY);
                
                game.touchStartX = null;
                game.touchStartY = null;
            }
        }

        function movePlayerTowards(targetX, targetY) {
            const dx = targetX - game.player.x;
            const dy = targetY - game.player.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance > 5) {
                const moveDistance = Math.min(game.player.speed * game.speedMultiplier * 3, distance);
                game.player.x += (dx / distance) * moveDistance;
                game.player.y += (dy / distance) * moveDistance;
                
                // Keep player in bounds
                game.player.x = Math.max(0, Math.min(config.canvasWidth - game.player.width, game.player.x));
                game.player.y = Math.max(0, Math.min(config.canvasHeight - game.player.height, game.player.y));
            }
        }

        function update() {
            if (!game.gameRunning) return;

            // Update player position based on keyboard input
            const speed = game.player.speed * game.speedMultiplier;
            
            if (game.keys['arrowup'] || game.keys['w']) {
                game.player.y -= speed;
            }
            if (game.keys['arrowdown'] || game.keys['s']) {
                game.player.y += speed;
            }
            if (game.keys['arrowleft'] || game.keys['a']) {
                game.player.x -= speed;
            }
            if (game.keys['arrowright'] || game.keys['d']) {
                game.player.x += speed;
            }

            // Keep player in bounds
            game.player.x = Math.max(0, Math.min(config.canvasWidth - game.player.width, game.player.x));
            game.player.y = Math.max(0, Math.min(config.canvasHeight - game.player.height, game.player.y));

            // Update data items
            game.dataItems.forEach(item => {
                item.y += item.velocityY;
                
                // Wrap around
                if (item.y > config.canvasHeight) {
                    item.y = -item.height;
                    item.x = Math.random() * (config.canvasWidth - item.width);
                }
            });

            // Update crocodiles
            game.crocodiles.forEach(croc => {
                croc.x += croc.velocityX;
                croc.y += croc.velocityY;
                
                // Bounce off walls
                if (croc.x <= 0 || croc.x >= config.canvasWidth - croc.width) {
                    croc.velocityX *= -1;
                }
                
                // Wrap around vertically
                if (croc.y > config.canvasHeight) {
                    croc.y = -croc.height;
                }
            });

            // Update seaweed
            game.seaweeds.forEach(seaweed => {
                seaweed.y += seaweed.velocityY;
                
                // Wrap around
                if (seaweed.y > config.canvasHeight) {
                    seaweed.y = -seaweed.height;
                    seaweed.x = Math.random() * (config.canvasWidth - seaweed.width);
                }
            });

            // Check collisions
            checkCollisions();
        }

        function checkCollisions() {
            // Check data collection
            game.dataItems = game.dataItems.filter(item => {
                if (checkCollision(game.player, item)) {
                    collectData(item.type);
                    showStatusMessage(`Collected ${item.icon} ${item.type} data!`);
                    return false;
                }
                return true;
            });

            // Check crocodile collisions
            game.crocodiles.forEach(croc => {
                if (checkCollision(game.player, croc)) {
                    handleCrocodileCollision();
                }
            });

            // Check seaweed collisions
            let inSeaweed = false;
            game.seaweeds.forEach(seaweed => {
                if (checkCollision(game.player, seaweed)) {
                    inSeaweed = true;
                }
            });

            if (inSeaweed && game.speedMultiplier === 1) {
                game.speedMultiplier = config.seaweedSlowFactor;
                showStatusMessage('🌿 Caught in seaweed! Slow down!');
                updateSpeedDisplay();
                
                // Clear existing timer
                if (game.seaweedTimer) {
                    clearTimeout(game.seaweedTimer);
                }
                
                // Set timer to restore speed
                game.seaweedTimer = setTimeout(() => {
                    game.speedMultiplier = 1;
                    updateSpeedDisplay();
                    showStatusMessage('Speed restored!');
                }, config.seaweedDuration);
            }
        }

        function checkCollision(obj1, obj2) {
            return obj1.x < obj2.x + obj2.width &&
                   obj1.x + obj1.width > obj2.x &&
                   obj1.y < obj2.y + obj2.height &&
                   obj1.y + obj1.height > obj2.y;
        }

        function collectData(type) {
            if (game.collectedData[type] < config.requiredPerType) {
                game.collectedData[type]++;
                game.score += 10 * game.level;
                updateUI();
                checkLevelComplete();
            }
        }

        function handleCrocodileCollision() {
            // Steal random collected data
            const types = Object.keys(game.collectedData).filter(type => game.collectedData[type] > 0);
            if (types.length > 0) {
                const randomType = types[Math.floor(Math.random() * types.length)];
                game.collectedData[randomType]--;
                showStatusMessage(`🐊 Crocodile stole your ${randomType} data!`);
                updateUI();
            }
        }

        function checkLevelComplete() {
            const allCollected = Object.values(game.collectedData).every(count => count >= config.requiredPerType);
            if (allCollected) {
                game.gameRunning = false;
                showLevelComplete();
            }
        }

        function showLevelComplete() {
            document.getElementById('overlay-title').textContent = 'Level Complete!';
            document.getElementById('overlay-message').textContent = 
                `Excellent work! You collected balanced data from all habitats. Score: ${game.score}`;
            document.getElementById('game-overlay').style.display = 'flex';
        }

        function nextLevel() {
            game.level++;
            game.collectedData = { forest: 0, mountain: 0, beach: 0, grassland: 0 };
            game.dataItems = [];
            game.crocodiles = [];
            game.seaweeds = [];
            game.speedMultiplier = 1;
            game.gameRunning = true;
            
            spawnDataItems();
            spawnCrocodiles();
            spawnSeaweed();
            
            updateUI();
            document.getElementById('game-overlay').style.display = 'none';
            showStatusMessage(`Level ${game.level} started! More challenges ahead!`);
        }

        function updateUI() {
            document.getElementById('level').textContent = game.level;
            document.getElementById('score').textContent = game.score;
            document.getElementById('forest-count').textContent = 
                `${game.collectedData.forest}/${config.requiredPerType}`;
            document.getElementById('mountain-count').textContent = 
                `${game.collectedData.mountain}/${config.requiredPerType}`;
            document.getElementById('beach-count').textContent = 
                `${game.collectedData.beach}/${config.requiredPerType}`;
            document.getElementById('grassland-count').textContent = 
                `${game.collectedData.grassland}/${config.requiredPerType}`;
            updateSpeedDisplay();
        }

        function updateSpeedDisplay() {
            const speedPercent = Math.round(game.speedMultiplier * 100);
            document.getElementById('speed').textContent = `${speedPercent}%`;
        }

        function showStatusMessage(message) {
            const statusEl = document.getElementById('status-message');
            statusEl.textContent = message;
            statusEl.style.display = 'block';
            
            setTimeout(() => {
                statusEl.style.display = 'none';
            }, 2000);
        }

        function draw() {
            // Clear canvas
            game.ctx.clearRect(0, 0, config.canvasWidth, config.canvasHeight);
            
            // Draw river flow effect
            drawRiver();

            // Draw seaweed
            game.seaweeds.forEach(seaweed => {
                game.ctx.fillStyle = '#2d5016';
                game.ctx.font = `${config.seaweedSize}px Arial`;
                game.ctx.fillText('🌿', seaweed.x, seaweed.y + seaweed.height);
            });

            // Draw data items
            game.dataItems.forEach(item => {
                game.ctx.font = `${config.dataSize}px Arial`;
                game.ctx.fillText(item.icon, item.x, item.y + item.height);
            });

            // Draw crocodiles
            game.crocodiles.forEach(croc => {
                game.ctx.font = `${config.obstacleSize}px Arial`;
                game.ctx.fillText('🐊', croc.x, croc.y + croc.height);
            });

            // Draw player (boat)
            game.ctx.font = `${config.playerSize}px Arial`;
            game.ctx.fillText('🚣', game.player.x, game.player.y + game.player.height);
        }

        function drawRiver() {
            const gradient = game.ctx.createLinearGradient(0, 0, 0, config.canvasHeight);
            gradient.addColorStop(0, '#6BA3C5');
            gradient.addColorStop(1, '#4A8FB0');
            game.ctx.fillStyle = gradient;
            game.ctx.fillRect(0, 0, config.canvasWidth, config.canvasHeight);
            
            // Draw subtle wave lines
            game.ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            game.ctx.lineWidth = 2;
            const time = Date.now() * 0.001;
            for (let i = 0; i < 10; i++) {
                game.ctx.beginPath();
                for (let x = 0; x < config.canvasWidth; x += 10) {
                    const y = i * 60 + Math.sin(x * 0.02 + time + i) * 10;
                    if (x === 0) {
                        game.ctx.moveTo(x, y);
                    } else {
                        game.ctx.lineTo(x, y);
                    }
                }
                game.ctx.stroke();
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start the game when page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
